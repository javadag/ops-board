<div
  class="input-wrapper"
  [class.disabled]="disabled"
  [class.has-error]="!!error"
>
  <label *ngIf="label" class="input-label" [attr.for]="id">
    {{ label }}
    <span *ngIf="required" class="required">*</span>
  </label>
  <div class="input-container">
    <span *ngIf="hasPrefix" class="input-prefix">
      <ng-content select="[input-prefix]"></ng-content>
    </span>
    <input
      [id]="id"
      [type]="type"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      [attr.aria-invalid]="!!error"
      [attr.aria-describedby]="error ? id + '-error' : null"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="native-input"
    />
    <span *ngIf="hasSuffix" class="input-suffix">
      <ng-content select="[input-suffix]"></ng-content>
    </span>
  </div>
  <span *ngIf="error" [id]="id + '-error'" class="input-error" role="alert">
    {{ error }}
  </span>
  <span *ngIf="hint && !error" class="input-hint">
    {{ hint }}
  </span>
</div>
