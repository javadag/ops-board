<div class="timeline" role="list">
  <div
    *ngFor="let item of events; let last = last; let index = index"
    class="timeline-item"
    [class.is-latest]="index === 0"
    role="listitem"
  >
    <div class="timeline-marker-col">
      <div
        class="timeline-node"
        [class]="'node-' + getStatusVariant(item.status)"
      ></div>
      <div *ngIf="!last" class="timeline-line"></div>
    </div>

    <div class="timeline-content">
      <header class="timeline-header">
        <div class="timeline-meta">
          <span class="timeline-time font-mono">{{
            formatTime(item.timestamp)
          }}</span>
          <ui-badge [variant]="getStatusVariant(item.status)" size="sm">
            {{ item.status }}
          </ui-badge>
        </div>
        <span class="timeline-author font-mono">{{ item.author }}</span>
      </header>

      <p class="timeline-summary">{{ item.summary }}</p>

      <div *ngIf="item.details" class="timeline-details">
        {{ item.details }}
      </div>

      <div *ngIf="item.actionTaken" class="timeline-action">
        <span class="action-tag font-mono">ACTION:</span> {{ item.actionTaken }}
      </div>
    </div>
  </div>

  <div *ngIf="!events || events.length === 0" class="timeline-empty">
    No timeline events recorded.
  </div>
</div>
