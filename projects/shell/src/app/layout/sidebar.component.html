<nav class="sidebar" [class.sidebar-open]="isOpen" aria-label="Main Navigation">
  <div class="sidebar-section">
    <span class="section-title">OPERATIONS</span>
    <ul class="nav-list">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobile.emit()"
          class="nav-link"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          <span>Command Center</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/incidents"
          routerLinkActive="active"
          (click)="closeMobile.emit()"
          class="nav-link"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon points="12 2 2 22 22 22" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <span>Incidents</span>
          <ui-badge variant="neutral" size="sm" class="mfe-tag">:4201</ui-badge>
        </a>
      </li>
      <li>
        <a
          routerLink="/services"
          routerLinkActive="active"
          (click)="closeMobile.emit()"
          class="nav-link"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2" />
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2" />
            <line x1="6" y1="6" x2="6.01" y2="6" />
            <line x1="6" y1="18" x2="6.01" y2="18" />
          </svg>
          <span>Services</span>
          <ui-badge variant="neutral" size="sm" class="mfe-tag">:4202</ui-badge>
        </a>
      </li>
    </ul>
  </div>

  <div class="sidebar-section">
    <span class="section-title">ARCHITECTURE & FLAGS</span>
    <div class="flags-box">
      <div class="flag-item">
        <span class="flag-name">Incident Replay</span>
        <input
          type="checkbox"
          [checked]="featureFlags.isEnabled('incidentReplay')"
          (change)="toggleFlag('incidentReplay', $event)"
          id="flag-replay"
        />
      </div>
      <div class="flag-item">
        <span class="flag-name">Service Topology</span>
        <input
          type="checkbox"
          [checked]="featureFlags.isEnabled('serviceDependencies')"
          (change)="toggleFlag('serviceDependencies', $event)"
          id="flag-topology"
        />
      </div>
      <div class="flag-item">
        <span class="flag-name">Auto Telemetry</span>
        <input
          type="checkbox"
          [checked]="featureFlags.isEnabled('autoRefresh')"
          (change)="toggleFlag('autoRefresh', $event)"
          id="flag-autorefresh"
        />
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="mfe-info">
      <span class="info-label">Host Shell</span>
      <span class="info-val font-mono">Port 4200 (Angular 22)</span>
    </div>
  </div>
</nav>
